<style>
body{background:#090b11;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.inp{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:8px 12px;font-size:13px;color:#fff;outline:none;width:100%}
.inp:focus{border-color:#DC2626}
.btn{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700}
.btn:hover{background:#334155}.btn-p{background:#DC2626;border-color:#DC2626}.btn-p:hover{background:#b91c1c}

th{font-size:10px;text-transform:uppercase;color:#94a3b8;text-align:left;padding:6px 8px;position:sticky;top:0;background:#131824;z-index:2;white-space:nowrap}
td{padding:5px 8px;font-size:12px;border-top:1px solid #1e293b}

.c-crit{background:rgba(127,29,29,.45);color:#fca5a5;border-color:#dc2626}
.c-warn{background:rgba(120,53,15,.45);color:#fcd34d;border-color:#d97706}
.c-info{background:#1e293b;color:#94a3b8;border-color:#334155}
.c-ok{background:rgba(6,78,59,.45);color:#6ee7b7;border-color:#059669}
.c-blue{background:rgba(12,74,110,.45);color:#7dd3fc;border-color:#0284c7}
.bar{height:8px;border-radius:4px;background:#1e293b;overflow:hidden;min-width:60px}.bar>i{display:block;height:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

.b-risk{background:rgba(120,53,15,.4);border-color:#d97706}.b-bad{background:rgba(127,29,29,.45);border-color:#dc2626}.b-none,.b-wait{background:#131824;border-color:#334155}

.pulse{animation:pl 1.4s infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}

<body>
<!-- LOGIN -->
<div id="login" class="fixed inset-0 flex items-center justify-center p-6 z-50 bg-[#090b11]">
  <div class="bg-card border border-slate-800 rounded-3xl p-8 w-full max-w-sm space-y-4">
    <div class="text-center"><div class="text-4xl">🗓️</div><h1 class="text-xl font-bold mt-2">Jadwal <span class="text-primary">Toko</span></h1><p class="text-[10px] uppercase tracking-widest text-slate-500">OutboundPro</p></div>

</div>

<!-- APP -->
<div id="app" class="hidden h-screen flex">
  <aside class="w-56 shrink-0 bg-card border-r border-slate-800 flex flex-col">
    <div class="p-4 border-b border-slate-800"><b>Jadwal <span class="text-primary">Toko</span></b><div class="text-[10px] text-slate-500 uppercase tracking-widest">OutboundPro</div></div>
    <nav id="nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>
    <div class="p-3 border-t border-slate-800 text-xs"><div id="who" class="font-bold truncate"></div><div id="role" class="text-slate-500 mb-2"></div><button class="btn w-full" onclick="logout()">Keluar</button></div>
  </aside>
  <main class="flex-1 min-w-0 flex flex-col">
    <header class="h-14 border-b border-slate-800 flex items-center justify-between px-6 gap-3">
      <h2 id="title" class="font-bold"></h2>
      <div class="flex items-center gap-3 text-xs"><span id="sync" class="text-slate-500"></span>
        <label class="lbl !mb-0">Periode</label><input id="per" type="month" class="inp !w-auto" onchange="setPer(this.value)"></div>
    </header>
    <div id="main" class="flex-1 overflow-auto p-6"></div>

</div>

<div id="modal" class="hidden fixed inset-0 z-40 bg-black/70 flex items-start justify-center overflow-auto p-6" onclick="if(event.target===this)closeModal()"><div id="mbox" class="bg-card border border-slate-700 rounded-2xl p-6 w-full max-w-xl my-auto"></div></div>
<div id="busy" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center"><div class="bg-card border border-slate-700 rounded-2xl px-8 py-6 text-center"><div class="animate-spin w-6 h-6 border-4 border-slate-600 border-t-primary rounded-full mx-auto mb-3"></div><div id="busyMsg" class="text-sm"></div></div></div>
<div id="toast" class="fixed bottom-6 right-6 z-50 hidden bg-slate-900 border border-slate-700 rounded-xl px-5 py-3 text-sm max-w-md"></div>

<script>
// ====== Firebase (project outbound-7a30c-32316) ======
firebase.initializeApp({apiKey:"AIzaSyB5-Ch8K8oZqN94ojBIsD7mz0eGypnwP5w",authDomain:"outbound-7a30c-32316.firebaseapp.com",projectId:"outbound-7a30c-32316",appId:"1:948813668363:web:e5bd0f2dfe12fb0a70670e"});
const auth=firebase.auth(), DOMAIN='@outboundpro.app';
const S={per:'',d:null,c:null,me:null,tab:'dash',busy:false,cutSel:null,tf:'all',f:{q:'',branch:'',group:'',status:'',page:0,ps:40},gf:{q:'',branch:'',page:0},sl:null,users:[],backups:[],bo:{}};
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const can=p=>S.me&&S.me.perms.includes(p), nf=n=>Number(n||0).toLocaleString('id-ID');
const pad=n=>String(n).padStart(2,'0'), HARI=['SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU','MINGGU'], HARI_JS=['MINGGU','SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU'];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'], BLN_FULL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const fmtD=s=>s?(+s.slice(8,10))+' '+BLN[+s.slice(5,7)-1]+' '+s.slice(0,4):'-';
const curPer=()=>{const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)};
const dayOf=(per,i)=>per+'-'+pad(i);
const dowName=(per,i)=>HARI_JS[new Date(+per.slice(0,4),+per.slice(5,7)-1,i,12).getDay()];
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='fixed bottom-6 right-6 z-50 bg-slate-900 border rounded-xl px-5 py-3 text-sm max-w-md '+(err?'border-red-500 text-red-300':'border-emerald-600');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hidden'),err?7000:3500)}
function busy(on,m){S.busy=on;$('#busy').classList.toggle('hidden',!on);$('#busyMsg').textContent=m||''}
function openModal(h,wide){$('#mbox').className='bg-card border border-slate-700 rounded-2xl p-6 w-full my-auto '+(wide?'max-w-4xl':'max-w-xl');$('#mbox').innerHTML=h;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
async function api(action,payload){
  const t=await auth.currentUser.getIdToken();
  const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({action,payload:payload||{}})});
  const tx=await r.text(); let j; try{j=JSON.parse(tx)}catch(e){throw new Error('Server error '+r.status+' — buka Vercel > Logs untuk detailnya')} if(!j.ok) throw new Error(j.error||'Gagal'); return j.data;
}
async function apiRetry(action,payload,tries){let e;for(let i=0;i<(tries||3);i++){try{return await api(action,payload)}catch(x){e=x;if(/izin|login|sesi|tidak valid|wajib|salah/i.test(x.message))throw x;await new Promise(r=>setTimeout(r,800*(i+1)))}}throw e}
async function run(fn,msg,ok){try{busy(true,msg||'Memproses...');await fn();if(ok)toast(ok)}catch(e){toast(e.message,true)}finally{busy(false)}}

// ====== Auth ======
async function login(){
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value; $('#le').textContent='';
  if(!u||!p){$('#le').textContent='Isi username & password';return}
  try{await auth.signInWithEmailAndPassword(u.includes('@')?u:u+DOMAIN,p)}catch(e){$('#le').textContent='Username atau password salah'}
}
function logout(){auth.signOut().then(()=>location.reload())}
auth.onAuthStateChanged(async u=>{
  if(!u){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}
  try{
    S.me=await api('me'); if(!can('view')) throw new Error('Akun ini belum punya akses ke Jadwal Toko. Hubungi admin.');
    $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
    $('#who').textContent=S.me.name;$('#role').textContent=S.me.role;
    S.per=curPer();$('#per').value=S.per;
    buildNav();await load();setInterval(poll,20000);
  }catch(e){$('#le').textContent=e.message;auth.signOut()}
});

// ====== Data & sinkronisasi otomatis ======
async function load(){
  S.d=await api('state',{periode:S.per});calc();render();$('#sync').textContent='Sinkron '+new Date().toLocaleTimeString('id-ID');
}
async function poll(){ if(!S.d||S.busy||!$('#modal').classList.contains('hidden'))return; try{const v=await api('ver');if(v.ver!==S.d.ver)await load()}catch(e){} }
function setPer(v){if(!v)return;S.per=v;S.cutSel=null;S.f.page=0;run(load,'Memuat periode...')}
function cnt(s,a,b){let n=0;for(let i=a;i<=b;i++)if(s&&s[i]==='1')n++;return n}
function autoCut(d){
  const cur=curPer();
  if(d.lastSL&&d.lastSL.slice(0,7)===S.per) return Math.min(+d.lastSL.slice(8,10),d.nd);
  if(S.per<cur) return d.nd; if(S.per===cur) return Math.min(new Date().getDate(),d.nd); return 0;
}
const newBr=()=>({n:0,reg:0,p:0,a:0,pc:0,ac:0,tutup:0,go:0,ach:0,bel:0,T:0,tAuto:false});
function calc(){
  const d=S.d,nd=d.nd,auto=autoCut(d),cut=S.cutSel!=null?Math.max(0,Math.min(nd,S.cutSel)):auto;
  const c={cut,auto,nd,tk:{},br:{},pd:new Array(nd+1).fill(0),ad:new Array(nd+1).fill(0),P:0,A:0,Pc:0,Ac:0,tutup:0,go:0,aktif:0,ach:0,bel:0,T:0,finished:(S.per<curPer())||cut>=nd};
  d.branches.forEach(b=>c.br[b]=newBr());
  d.toko.forEach(k=>{
    const pl=d.plan[k.kode]||'',ac=d.act[k.kode]||'',x={p:cnt(pl,1,nd),a:cnt(ac,1,nd),pc:cnt(pl,1,cut),ac:cnt(ac,1,cut)};c.tk[k.kode]=x;
    const b=c.br[k.branch]=c.br[k.branch]||newBr();
    b.reg++;if(x.p>0)b.n++;b.p+=x.p;b.a+=x.a;b.pc+=x.pc;b.ac+=x.ac;
    if(x.pc>0){if(x.ac>=x.pc){b.ach++;c.ach++}else{b.bel++;c.bel++}}
    if(k.status==='TUTUP'){b.tutup++;c.tutup++}else if(k.status==='GO'){b.go++;c.go++}
    c.P+=x.p;c.A+=x.a;c.Pc+=x.pc;c.Ac+=x.ac;if(x.p>0)c.aktif++;
    for(let i=1;i<=nd;i++){if(pl[i]==='1')c.pd[i]++;if(ac[i]==='1')c.ad[i]++}
  });
  const T=d.target.total||0,ex=d.target.branch||{};let exSum=0,nAuto=0;
  Object.keys(c.br).forEach(b=>{if(ex[b]>0)exSum+=ex[b];else nAuto+=c.br[b].n});
  Object.keys(c.br).forEach(b=>{const x=c.br[b];
    if(ex[b]>0){x.T=ex[b];x.tAuto=false}else if(T>0&&nAuto>0){x.T=Math.round(Math.max(0,T-exSum)*x.n/nAuto);x.tAuto=true}});
  c.T=T>0?T:exSum;
  c.st=tstat(c.T,c.P,c.A,c.Pc,c);
  Object.keys(c.br).forEach(b=>{const x=c.br[b];x.st=tstat(x.T,x.p,x.a,x.pc,c)});
  S.c=c;
}
// Status pencapaian target: TERCAPAI / TIDAK TERCAPAI (bulan selesai) / ON TRACK / BERISIKO (proyeksi = aktual + sisa plan x %aktual berjalan)
function tstat(T,P,A,Pc,c){
  if(!T) return {k:'none',t:'Target belum diisi',proj:0,gap:0};
  const proj=Math.round(A+(P-Pc)*(Pc>0?A/Pc:1));
  if(A>=T) return {k:'ok',t:'TERCAPAI',proj,gap:0};
  if(c.finished) return {k:'bad',t:'TIDAK TERCAPAI',proj:A,gap:T-A};
  if(c.cut===0) return {k:'wait',t:'BELUM MULAI',proj:P,gap:T-P};
  return proj>=T?{k:'track',t:'ON TRACK',proj,gap:0}:{k:'risk',t:'BERISIKO',proj,gap:T-proj};
}
const STC={ok:'c-ok',track:'c-blue',risk:'c-warn',bad:'c-crit',none:'c-info',wait:'c-info'};
const stChip=st=>`<span class="chip ${STC[st.k]}">${st.t}</span>`;

// ====== Alarm (dihitung server, selalu untuk bulan berjalan) ======
const ALT={GO_HARI_INI:'GO hari ini',GO_SEGERA:'GO segera',GO_AKAN:'GO akan datang',GO_BELUM_SL:'GO belum ada SL',TUTUP_HARI_INI:'Tutup hari ini',TUTUP_SEGERA:'Tutup segera',TUTUP_AKAN:'Tutup akan datang',TUTUP_ADA_SL:'Tutup tapi ada SL',BELUM_KIRIM:'> 4 hari belum kirim'};
const LVC={crit:'c-crit',warn:'c-warn',info:'c-info'};
const alChip=a=>`<span class="chip ${LVC[a.level]} ${a.level==='crit'?'pulse':''}" title="${esc(a.msg)}">${ALT[a.type]||a.type}${a.type.endsWith('SEGERA')?' H-'+a.hari:''}</span>`;
function alMap(){const m={};(S.d.alarm.list||[]).forEach(a=>(m[a.kode]=m[a.kode]||[]).push(a));return m}
const alActive=()=>(S.d.alarm.list||[]).filter(a=>a.level!=='info');
const alStatus=()=>alActive().filter(a=>/^(GO|TUTUP)/.test(a.type));

// ====== Navigasi ======
const MENU=[['dash','📊','Dashboard','view'],['jadwal','🗓️','Jadwal Toko','view'],['status','🏪','Tutup / GO','view'],['libur','⛔','Libur / SO','view'],['group','🚛','Group','view'],
  ['upload','⬆️','Upload SL','upload'],['download','⬇️','Download','download'],['riwayat','🕘','Riwayat','view'],['admin','🛡️','Admin','admin']];
function buildNav(){$('#nav').innerHTML=MENU.filter(m=>can(m[3])).map(m=>`<button id="n-${m[0]}" onclick="go('${m[0]}')" class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold text-slate-400 hover:bg-white/5">${m[1]} ${m[2]}<span id="nb-${m[0]}"></span></button>`).join('')}
function go(t){S.tab=t;S.f.page=0;S.gf.page=0;render()}
let _rendering=false;
function render(){
  if(!S.d||_rendering)return;      // cegah render ganda (mis. event blur/change saat elemen fokus dihapus)
  _rendering=true;try{renderNow()}finally{_rendering=false}
}
function renderNow(){
  document.querySelectorAll('#nav button').forEach(b=>b.className='w-full text-left px-3 py-2 rounded-xl text-sm font-semibold '+(b.id==='n-'+S.tab?'bg-white/10 text-white':'text-slate-400 hover:bg-white/5'));
  const nb=$('#nb-status');if(nb){const n=alStatus().length;nb.innerHTML=n?`<span class="navbadge ${alStatus().some(a=>a.level==='crit')?'pulse':''}">${n}</span>`:''}
  const m=MENU.find(x=>x[0]===S.tab);$('#title').textContent=m?m[2]:'';
  const V={dash:vDash,jadwal:vJadwal,status:vStatus,libur:vLibur,group:vGroup,upload:vUpload,download:vDownload,riwayat:vRiwayat,admin:vAdmin};
  try{$('#main').innerHTML=V[S.tab]()}catch(e){console.error(e);$('#main').innerHTML='<div class="text-red-400 text-sm">Gagal menampilkan halaman: '+esc(e.message)+'</div>'}
  if(S.tab==='riwayat')loadRiwayat();if(S.tab==='admin')loadAdmin();if(S.tab==='libur')loadLiburHist();
}
const card=(t,b)=>`<div class="bg-card border border-slate-800 rounded-2xl p-5 ${b||''}">${t}</div>`;
const kpi=(l,v,s,cls)=>card(`<div class="text-[10px] font-bold uppercase text-slate-400">${l}</div><div class="text-3xl font-extrabold mt-2 ${cls||''}">${v}</div><div class="text-[11px] text-slate-500 mt-1">${s||''}</div>`);
const optList=(a,sel,ph)=>(ph!=null?`<option value="">${ph}</option>`:'')+a.map(o=>`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');
const refresh=async()=>{closeModal();await load()};

// ====== Dashboard ======
const dnum=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5;
const cd=s=>{if(!s)return'';const n=Math.round(dnum(s)-dnum(S.d.today));return n===0?'HARI INI':n>0?'H-'+n:'H+'+(-n)};
function vDash(){
  const c=S.c,d=S.d,al=d.alarm,e=can('edit'),pn=BLN_FULL[+S.per.slice(5)-1]+' '+S.per.slice(0,4),st=c.st;
  const glob=(al.global||[]).map(g=>`<div class="chip ${LVC[g.level]} !whitespace-normal">⏱ ${esc(g.msg)}</div>`).join(' ');
  const tIn=e?`<div class="flex items-end gap-2 flex-wrap"><div><label class="lbl">Target kiriman ${pn}</label><input id="tgT" type="number" min="0" class="inp !w-40" value="${d.target.total||''}" placeholder="mis. 27724"></div>
    <button class="btn btn-p" onclick="saveTargetTotal()">Simpan target</button><button class="btn" onclick="openTargetBr()">Target per branch</button></div>`:'';
  const sub=!c.T?`Isi angka target bulan ini di kolom sebelah kanan, lalu web otomatis menghitung pencapaian plan & aktual.`:
    `Aktual s/d H${c.cut}: <b>${nf(c.A)}</b> (${pct(c.A,c.T)}% dari target) · Plan bulan <b>${nf(c.P)}</b> ${c.P>=c.T?'<span class="text-emerald-400">(cukup, lebih '+nf(c.P-c.T)+')</span>':'<span class="text-red-400">(kurang '+nf(c.T-c.P)+' dari target!)</span>'} · Proyeksi akhir bulan <b>${nf(st.proj)}</b>`;
  const cutIn=`<div class="flex items-end gap-2"><div><label class="lbl">Hitung s/d tanggal</label><input id="cutI" type="number" min="0" max="${c.nd}" class="inp !w-24" value="${c.cut}" onchange="setCut(this.value)"></div>
    <button class="btn btn-s" onclick="setCut('')" title="Otomatis mengikuti tanggal SL terakhir">Otomatis (H${c.auto})</button></div>`;
  const ico={ok:'✅',track:'📈',risk:'⚠️',bad:'❌',none:'🎯',wait:'⏳'}[st.k];
  const analisa=analisaList().map(a=>`<li class="flex gap-2 py-1.5 border-b border-slate-800/70 last:border-0"><span>${a.i}</span><span class="text-sm ${a.cls||''}">${a.t}</span></li>`).join('');
  const brs=Object.keys(c.br).filter(b=>c.br[b].reg>0).sort((a,b)=>d.branches.indexOf(a)-d.branches.indexOf(b));
  const row=(b,x,tot)=>`<tr class="${tot?'font-bold bg-white/5':''}"><td class="font-bold">${esc(b)}</td><td>${nf(x.n)}</td><td>${x.T?nf(x.T)+(x.tAuto?' <span class="text-slate-500" title="dibagi otomatis menurut jumlah toko">~</span>':''):'-'}</td><td>${nf(x.p)}</td>
    <td class="${x.T&&x.p<x.T?'text-red-400':'text-emerald-400'}">${x.T?nf(x.p-x.T):'-'}</td><td>${nf(x.pc)}</td><td>${nf(x.ac)}</td><td>${nf(x.ac-x.pc)}</td>

function analisaList(){
  const c=S.c,d=S.d,L=[],pn=BLN_FULL[+S.per.slice(5)-1],st=c.st,sisa=c.nd-c.cut;
  if(!c.T)L.push({i:'🎯',t:'Target bulan '+pn+' belum diisi — isi di banner atas agar status tercapai / tidak otomatis muncul.',cls:'text-amber-300'});
  else if(st.k==='ok')L.push({i:'✅',t:`<b>Target tercapai</b>: aktual ${nf(c.A)} sudah ≥ target ${nf(c.T)} (${pct(c.A,c.T)}%).`});
  else if(st.k==='bad')L.push({i:'❌',t:`<b>Target bulan ${pn} tidak tercapai</b>: aktual ${nf(c.A)} dari target ${nf(c.T)} (${pct(c.A,c.T)}%), kurang ${nf(st.gap)} kiriman.`,cls:'text-red-300'});
  else if(st.k==='risk')L.push({i:'⚠️',t:`<b>Berisiko tidak tercapai</b>: proyeksi akhir bulan ${nf(st.proj)} vs target ${nf(c.T)} (kurang ${nf(st.gap)}). ${sisa>0?'Butuh rata-rata <b>'+nf(Math.ceil((c.T-c.A)/sisa))+'</b> kiriman/hari selama '+sisa+' hari tersisa (plan rata-rata '+nf(Math.round((c.P-c.Pc)/sisa))+'/hari).':''}`,cls:'text-amber-300'});
  else if(st.k==='track')L.push({i:'📈',t:`<b>On track</b>: proyeksi akhir bulan ${nf(st.proj)} ≥ target ${nf(c.T)}.`,cls:'text-sky-300'});
  else L.push({i:'⏳',t:'Periode belum dimulai — plan bulan ini '+nf(c.P)+(c.T?(c.P>=c.T?' (cukup untuk target).':' (kurang '+nf(c.T-c.P)+' dari target).'):'.')});
  if(c.T&&c.P<c.T)L.push({i:'📋',t:`Plan bulan ini (${nf(c.P)}) <b>lebih kecil ${nf(c.T-c.P)}</b> dari target — tambah jadwal / toko GO agar target mungkin tercapai.`,cls:'text-red-300'});
  if(c.cut>0)L.push({i:'🚚',t:`Realisasi s/d H${c.cut}: aktual ${nf(c.Ac)} dari plan ${nf(c.Pc)} (<b>${pct(c.Ac,c.Pc)}%</b>), selisih ${nf(c.Ac-c.Pc)}. Toko achieve ${nf(c.ach)}, belum achieve ${nf(c.bel)}.`});
  const bl=Object.keys(c.br).filter(b=>c.br[b].pc>0).map(b=>({b,p:pct(c.br[b].ac,c.br[b].pc),x:c.br[b]})).sort((a,b)=>b.p-a.p);
  if(c.cut>0&&bl.length>1){const hi=bl[0],lo=bl[bl.length-1];L.push({i:'🏁',t:`Branch terbaik <b>${esc(hi.b)}</b> (${hi.p}%), terendah <b>${esc(lo.b)}</b> (${lo.p}%) dengan ${nf(lo.x.bel)} toko belum achieve.`});}
  let mg=0,md=0;for(let i=1;i<=c.cut;i++){const g=c.pd[i]-c.ad[i];if(g>mg){mg=g;md=i}}
  if(md)L.push({i:'📉',t:`Gap harian terbesar pada tanggal ${md}: plan ${nf(c.pd[md])}, aktual ${nf(c.ad[md])} (kurang ${nf(mg)}).`});
  const A=alActive(),n=t=>A.filter(a=>a.type===t).length;
  if(A.length)L.push({i:'🚨',t:`Alarm aktif: GO hari ini/segera <b>${n('GO_HARI_INI')+n('GO_SEGERA')}</b>, GO belum ada SL <b>${n('GO_BELUM_SL')}</b>, tutup hari ini/segera <b>${n('TUTUP_HARI_INI')+n('TUTUP_SEGERA')}</b>, tutup tapi masih ada SL <b>${n('TUTUP_ADA_SL')}</b>, &gt; 4 hari belum kirim <b>${n('BELUM_KIRIM')}</b>.`,cls:'text-amber-300'});
  else L.push({i:'✅',t:'Tidak ada alarm toko GO / tutup yang perlu ditindak.'});
  const nb=d.blackout.filter(b=>b.tgl.slice(0,7)===S.per);
  if(nb.length)L.push({i:'⛔',t:`${nb.length} libur / SO aktif pada periode ini — memengaruhi <b>${nf(Object.keys(d.awal).length)}</b> toko (lihat menu Libur / SO untuk tombol kembali ke jadwal awal).`});
  const days=Object.keys(d.sl||{});
  if(days.length){let pb=0,sh=0,last=0;days.forEach(k=>{pb+=d.sl[k].rpPb;sh+=d.sl[k].rpShip;last=Math.max(last,+k)});const x=d.sl[last];
    if(pb)L.push({i:'💰',t:`SL nilai (Rp Ship ÷ Rp PB): bulan ini <b>${pct(sh,pb)}%</b>${x&&x.rpPb?`, hari terakhir (tgl ${last}) <b>${pct(x.rpShip,x.rpPb)}%</b>`:''}.`})}
  return L;
}
function cumChart(){
  const c=S.c,nd=c.nd,W=900,H=230,L=48,R=16,T=14,B=26,cp=[],ca=[];let sp=0,sa=0;
  for(let i=1;i<=nd;i++){sp+=c.pd[i];cp.push(sp);if(i<=Math.max(c.cut,0)){sa+=c.ad[i];ca.push(sa)}}
  const mx=Math.max(1,sp,c.T||0,sa),x=i=>L+(i-1)*(W-L-R)/Math.max(1,nd-1),y=v=>T+(H-T-B)*(1-v/mx);
  const pl=a=>a.map((v,i)=>(i?'L':'M')+x(i+1).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1e293b"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" fill="#64748b" font-size="10">${nf(Math.round(v))}</text>`}
  let xl='';for(let i=1;i<=nd;i+=Math.ceil(nd/15))xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="#64748b" font-size="10">${i}</text>`;
  const tl=c.T?`<line x1="${L}" x2="${W-R}" y1="${y(c.T)}" y2="${y(c.T)}" stroke="#f59e0b" stroke-dasharray="6 4"/><text x="${W-R}" y="${y(c.T)-5}" text-anchor="end" fill="#f59e0b" font-size="11" font-weight="700">Target ${nf(c.T)}</text>`:'';
  return`<div class="scroll"><svg viewBox="0 0 ${W} ${H}" class="w-full min-w-[640px]" role="img" aria-label="Grafik kumulatif">${g}${xl}${tl}<path d="${pl(cp)}" fill="none" stroke="#64748b" stroke-width="2"/>${ca.length?`<path d="${pl(ca)}" fill="none" stroke="#DC2626" stroke-width="2.5"/>`:''}</svg></div>
   <div class="flex gap-4 text-[11px] text-slate-400 mt-1"><span><b style="color:#64748b">━</b> Plan kumulatif (${nf(sp)})</span><span><b class="text-primary">━</b> Aktual kumulatif (${nf(sa)})</span>${c.T?'<span><b class="text-amber-400">╍</b> Target</span>':''}</div>`;
}

// ====== Tutup / GO dengan alarm ======
function vStatus(){
  const d=S.d,am=alMap(),rank={crit:0,warn:1,info:2},sev=t=>Math.min(3,...(am[t.kode]||[]).map(a=>rank[a.level]),3);
  let l=d.toko.filter(t=>t.status!=='AKTIF'||t.tutup||t.go||(am[t.kode]||[]).some(a=>a.type!=='BELUM_KIRIM'));
  const A=alStatus(),nGo=l.filter(t=>t.go).length,nTutup=l.filter(t=>t.tutup).length;
  const tf=S.tf;
  if(tf==='go')l=l.filter(t=>t.go);else if(tf==='tutup')l=l.filter(t=>t.tutup);else if(tf==='alarm')l=l.filter(t=>(am[t.kode]||[]).some(a=>a.level!=='info'));
  l.sort((a,b)=>sev(a)-sev(b)||(b.tutup||b.go).localeCompare(a.tutup||a.go));
  const by=t=>A.filter(a=>a.type===t).length,sm=(t,txt,cls)=>`<div class="chip ${cls}">${txt}: <b>${by(t)}</b></div>`;
  const tab=(k,t,n)=>`<span class="tab ${tf===k?'on':''}" onclick="S.tf='${k}';render()">${t} (${n})</span>`;
  const rows=l.map(t=>{const as=(am[t.kode]||[]),w=as.some(a=>a.level==='crit')?'rowc':as.some(a=>a.level==='warn')?'roww':'';
    const stc=t.status==='TUTUP'?'c-crit':t.status==='GO'?'c-ok':'c-info';
    return`<tr class="hover:bg-white/5 cursor-pointer ${w}" onclick="openToko('${esc(t.kode)}')"><td class="font-mono font-bold">${esc(t.kode)}</td><td>${esc(t.nama)}</td><td>${esc(t.branch)}</td><td>${esc(t.group)}</td><td><span class="chip ${stc}">${t.status}</span></td>
     <td>${t.tutup?fmtD(t.tutup)+' <span class="text-slate-500">'+cd(t.tutup)+'</span>':''}</td><td>${t.go?fmtD(t.go)+' <span class="text-slate-500">'+cd(t.go)+'</span>':''}</td>
     <td><div class="flex flex-wrap gap-1">${as.filter(a=>a.type!=='BELUM_KIRIM').map(alChip).join('')||'<span class="text-slate-600">—</span>'}</div></td><td class="text-slate-400 max-w-[220px] truncate" title="${esc(t.ket)}">${esc(t.ket)}</td></tr>`}).join('');
  return`<div class="space-y-4">${(d.alarm.global||[]).map(g=>`<div class="chip ${LVC[g.level]} !whitespace-normal">⏱ ${esc(g.msg)}</div>`).join('')}
   ${card(`<div class="text-sm font-bold mb-3">🚨 Pusat alarm <span class="text-slate-500 font-normal">— dihitung untuk hari ini (${fmtD(d.today)}); email otomatis tiap pagi ke ${esc(d.setting.ALARM_EMAIL)}</span></div>
    <div class="flex flex-wrap gap-2">${sm('GO_HARI_INI','GO hari ini','c-crit')}${sm('GO_SEGERA','GO ≤ 3 hari','c-warn')}${sm('GO_BELUM_SL','GO belum ada SL','c-crit')}${sm('TUTUP_HARI_INI','Tutup hari ini','c-crit')}${sm('TUTUP_SEGERA','Tutup ≤ 3 hari','c-warn')}${sm('TUTUP_ADA_SL','Tutup tapi ada SL','c-crit')}${sm('BELUM_KIRIM','&gt; 4 hari belum kirim','c-warn')}</div>
    ${can('admin')?'<div class="mt-3"><button class="btn btn-s" onclick="sendAlarmNow()">✉️ Kirim email alarm sekarang</button></div>':''}`)}
   ${card(`<div class="flex justify-between items-center mb-3 flex-wrap gap-2"><div class="tabs">${tab('all','Semua',nGo+nTutup>0?l.length&&tf==='all'?l.length:d.toko.filter(t=>t.status!=='AKTIF'||t.tutup||t.go).length:0)}${tab('go','GO',nGo)}${tab('tutup','Tutup',nTutup)}${tab('alarm','Alarm aktif',A.length)}</div>${can('edit')?'<button class="btn btn-p" onclick="formToko()">+ Toko Baru (GO)</button>':''}</div>
    <div class="overflow-auto max-h-[62vh]"><table class="w-full"><thead><tr><th>Kode</th><th>Nama</th><th>Branch</th><th>Group</th><th>Status</th><th>Tutup mulai</th><th>GO mulai</th><th>Alarm</th><th>Keterangan</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="text-center text-slate-500 py-8">Tidak ada data</td></tr>'}</tbody></table></div>`)}</div>`;
}
function sendAlarmNow(){run(async()=>{const r=await api('alarmEmail');toast(r.sent?'Email alarm terkirim ke '+r.to+' ('+r.n+' toko)':'Tidak ada alarm — email tidak dikirim')},'Mengirim email...')}

// ====== Libur / Stock Opname ======
const gOfT=(t,ds)=>(t.berlaku&&t.groupLama&&ds<t.berlaku)?t.groupLama:t.group;
const bm=(b,t,ds)=>b.scope==='ALL'||(b.scope==='BRANCH'&&b.nilai===t.branch)||(b.scope==='GROUP'&&b.nilai===gOfT(t,ds));
const rangeLbl=b=>b.tgl===b.tglAkhir||!b.tglAkhir?fmtD(b.tgl):fmtD(b.tgl)+' – '+fmtD(b.tglAkhir);
const aksiLbl=b=>b.mode==='GESER'?'Geser +'+b.geser+' hari':'Kosongkan';
const scopeLbl=b=>b.scope==='ALL'?'Semua toko':(b.scope==='BRANCH'?'Branch: ':'Group: ')+b.nilai;
// toko yang terdampak entri b. basis 'raw' = jadwal awal (sebelum libur/SO), 'plan' = jadwal saat ini
function affected(b,basis){
  if(!b.tgl||b.tgl.slice(0,7)!==S.per)return null;
  const d=S.d,i0=+b.tgl.slice(8,10),i1=Math.min(d.nd,+((b.tglAkhir||b.tgl).slice(8,10))),out=[];
  d.toko.forEach(t=>{const s=basis==='raw'?(d.awal[t.kode]||d.plan[t.kode]||''):(d.plan[t.kode]||''),days=[];
    for(let i=i0;i<=i1;i++)if(s[i]==='1'&&bm(b,t,dayOf(S.per,i)))days.push(i);
    if(days.length)out.push({t,days})});
  return out;
}
function vLibur(){
  const d=S.d,e=can('edit'),brs=d.branches,grs=d.groups.map(g=>g.group);
  const all=d.blackout.slice().sort((a,b)=>b.tgl.localeCompare(a.tgl));S.boList=all;
  const inPer=all.filter(b=>b.tgl.slice(0,7)===S.per);
  let rawSum=0,curSum=0;d.toko.forEach(t=>{const p=d.plan[t.kode]||'',r=d.awal[t.kode]||p;for(let i=1;i<=d.nd;i++){if(r[i]==='1')rawSum++;if(p[i]==='1')curSum++}});
  const nAff=Object.keys(d.awal).length;
  const rows=all.map((b,ix)=>{const cur=b.tgl.slice(0,7)===S.per,af=cur?affected(b,'raw'):null;
    return`<tr class="${cur?'':'opacity-60'}"><td class="whitespace-nowrap">${rangeLbl(b)}${cur?'':' <span class="chip c-info">'+b.tgl.slice(0,7)+'</span>'}</td><td>${esc(scopeLbl(b))}</td><td><span class="chip ${b.mode==='GESER'?'c-blue':'c-warn'}">${aksiLbl(b)}</span></td>
     <td class="font-bold">${af?nf(af.length):'-'}</td><td class="text-slate-400">${nf(b.jml)}</td><td class="text-slate-400 max-w-[160px] truncate" title="${esc(b.ket)}">${esc(b.ket)}</td><td class="text-slate-500 text-[11px]">${esc(b.oleh)}<br>${esc(b.waktu.slice(0,16))}</td>
     <td class="whitespace-nowrap">${cur?`<button class="btn btn-s" onclick="lihatBo(${ix})">Lihat toko</button> `:''}${e?`<button class="btn btn-s" onclick="delBo(${ix})">↩ Kembalikan</button>`:''}</td></tr>`}).join('');
  const form=e?card(`<div class="text-sm font-bold mb-3">Tambah Libur / Stock Opname</div><div class="space-y-3">
   <div class="grid grid-cols-2 gap-2"><div><label class="lbl">Tanggal mulai</label><input id="bt" type="date" class="inp" oninput="boPrev()"></div><div><label class="lbl">Sampai (opsional)</label><input id="bt2" type="date" class="inp" oninput="boPrev()"></div></div>
   <div><label class="lbl">Berlaku untuk</label><select id="bs" class="inp" onchange="bsc()"><option value="ALL">Semua toko</option><option value="BRANCH">Satu branch</option><option value="GROUP">Satu group</option></select></div>
   <div id="bnw" class="hidden"><label class="lbl">Pilih</label><select id="bn" class="inp" onchange="boPrev()"></select></div>
   <div><label class="lbl">Aksi pada toko yang terjadwal</label><select id="bmd" class="inp" onchange="bsc()"><option value="KOSONG">Kosongkan / non-aktifkan jadwal</option><option value="GESER">Geser jadwal ke hari berikutnya</option></select></div>
   <div id="bgw" class="hidden"><label class="lbl">Geser berapa hari</label><input id="bg" type="number" min="1" max="14" value="1" class="inp" oninput="boPrev()"></div>
   <div><label class="lbl">Keterangan</label><input id="bk" class="inp" placeholder="Stock Opname Nasional"></div>
   <div id="bpv" class="text-xs text-slate-400 border border-dashed border-slate-700 rounded-xl p-3">Pilih tanggal untuk melihat toko yang terdampak.</div>
   <button class="btn btn-p w-full" onclick="addBo()">Simpan Libur / SO</button></div>`):'';
  return`<div class="space-y-5"><div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${kpi('Libur / SO periode ini',inPer.length,'entri aktif')}${kpi('Toko terdampak',nf(nAff),'jadwal berubah dari jadwal awal',nAff?'text-amber-400':'')}${kpi('Plan dikosongkan / digeser',nf(Math.max(0,rawSum-curSum)),'kiriman hilang dari plan awal '+nf(rawSum))}${kpi('Plan sekarang',nf(curSum),'setelah libur / SO')}</div>
   <div class="grid lg:grid-cols-3 gap-5">${form}
   ${card(`<div class="flex justify-between items-center mb-3 flex-wrap gap-2"><div class="text-sm font-bold">Daftar Libur / SO (${all.length}) <span class="text-slate-500 font-normal">— "Kembalikan" = hapus entri &amp; jadwal toko kembali ke awal</span></div>${e&&inPer.length?'<button class="btn btn-s" onclick="resetBo()">↩ Kembalikan SEMUA ke jadwal awal ('+S.per+')</button>':''}</div>
    <div class="overflow-auto max-h-[46vh]"><table class="w-full"><thead><tr><th>Tanggal</th><th>Berlaku</th><th>Aksi</th><th>Toko terdampak</th><th>Saat dicatat</th><th>Ket</th><th>Oleh</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="text-center text-slate-500 py-6">Belum ada libur / SO</td></tr>'}</tbody></table></div>`,e?'lg:col-span-2':'lg:col-span-3')}</div>
   ${card(`<div class="text-sm font-bold mb-3">Riwayat Libur / SO <span class="text-slate-500 font-normal">— siapa, kapan, berapa toko dikosongkan / digeser / dikembalikan</span></div><div id="lh" class="overflow-auto max-h-[36vh] text-xs">Memuat...</div>`)}</div>`;
}
function bsc(){
  const s=$('#bs').value;$('#bnw').classList.toggle('hidden',s==='ALL');$('#bgw').classList.toggle('hidden',$('#bmd').value!=='GESER');
  if(s!=='ALL')$('#bn').innerHTML=(s==='BRANCH'?S.d.branches:S.d.groups.map(g=>g.group)).map(x=>`<option>${esc(x)}</option>`).join('');boPrev();
}
function boForm(){const s=$('#bs').value,md=$('#bmd').value;return{tgl:$('#bt').value,tglAkhir:$('#bt2').value||$('#bt').value,scope:s,nilai:s==='ALL'?'':$('#bn').value,mode:md,geser:md==='GESER'?Math.max(1,Math.round(+$('#bg').value||1)):0,ket:$('#bk').value}}
function boPrev(){
  const b=boForm(),el=$('#bpv');if(!el)return;
  if(!b.tgl){el.innerHTML='Pilih tanggal untuk melihat toko yang terdampak.';return}
  if(b.tglAkhir<b.tgl){el.innerHTML='<span class="text-red-400">Tanggal akhir sebelum tanggal mulai.</span>';return}
  if(b.tgl.slice(0,7)!==b.tglAkhir.slice(0,7)){el.innerHTML='<span class="text-red-400">Rentang harus dalam satu bulan.</span>';return}
  if(b.tgl.slice(0,7)!==S.per){el.innerHTML='<span class="text-amber-400">Tanggal di luar periode '+S.per+' — ganti periode di kanan atas untuk melihat daftar toko terdampak. Entri tetap bisa disimpan.</span>';return}
  const af=affected(b,'plan'),days=af.reduce((s,x)=>s+x.days.length,0);
  el.innerHTML=`<div class="text-sm"><b class="${af.length?'text-amber-300':'text-slate-300'}">${nf(af.length)} toko</b> akan ${b.mode==='GESER'?'digeser +'+b.geser+' hari':'dikosongkan / dinonaktifkan'} (${nf(days)} kiriman).</div>
   ${af.length?`<div class="mt-2 max-h-40 overflow-auto">${af.slice(0,60).map(x=>`<div class="flex justify-between border-b border-slate-800 py-0.5"><span><b class="font-mono">${esc(x.t.kode)}</b> ${esc(x.t.nama).slice(0,22)}</span><span class="text-slate-500">${esc(x.t.group)} · tgl ${x.days.join(', ')}${b.mode==='GESER'?' → '+x.days.map(i=>i+b.geser).join(', '):''}</span></div>`).join('')}${af.length>60?`<div class="text-slate-500 pt-1">… dan ${af.length-60} toko lainnya (daftar lengkap tersedia setelah disimpan: tombol "Lihat toko")</div>`:''}</div>`:''}`;
}
function addBo(){

// ====== Utilitas baca file (xlsx / csv / xls berisi HTML seperti file SL & REP_JWC) ======
const MON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,MEI:5,JUN:6,JUL:7,AUG:8,AGU:8,AGT:8,AGS:8,SEP:9,SEPT:9,OCT:10,OKT:10,NOV:11,NOP:11,DEC:12,DES:12};
const MON_EN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'],MON3=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function toDS(v){
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v==null?'':v).trim();if(!s)return'';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=s.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,9})[-\/. ,]+(\d{2,4})/);
  if(m){const mo=MON[m[2].toUpperCase().slice(0,m[2].length>=4&&/^SEPT/i.test(m[2])?4:3)];let y=+m[3];if(y<100)y+=2000;return mo?y+'-'+pad(mo)+'-'+pad(+m[1]):''}
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return m?m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]):'';
}
function toNum(v){
  if(typeof v==='number')return isFinite(v)?v:0;let s=String(v==null?'':v).trim().replace(/\s/g,'');if(!s)return 0;
  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');                       // 8,372,729  /  1,234.5  (format file SL)
  else if(/^-?\d{1,3}(\.\d{3}){2,}(,\d+)?$/.test(s)||/^-?\d{1,3}(\.\d{3})+,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');   // 1.234.567  /  1.234,5 (format Indonesia)
  else if(/^-?\d+,\d{1,2}$/.test(s))s=s.replace(',','.');                                // 12,5
  else s=s.replace(/,/g,'');
  const n=Number(s);return isFinite(n)?n:0;
}
async function readTable(f){
  const buf=await f.arrayBuffer(),txt=new TextDecoder('utf-8').decode(buf.slice(0,2000)).toLowerCase();
  if(txt.indexOf('<table')>=0||/^\s*(<!doctype|<html|<\?xml)/.test(txt)){                 // .xls yang sebenarnya HTML
    const doc=new DOMParser().parseFromString(new TextDecoder('utf-8').decode(buf),'text/html'),tbs=[...doc.querySelectorAll('table')];
    if(!tbs.length)throw new Error('Tabel data tidak ditemukan di file');
    tbs.sort((a,b)=>b.rows.length-a.rows.length);
    return{name:f.name,aoa:[...tbs[0].rows].map(r=>[...r.cells].map(c=>c.textContent.replace(/\u00a0/g,' ').trim()))};
  }
  const wb=XLSX.read(buf,{type:'array'}),name=wb.SheetNames.find(n=>/SL/i.test(n))||wb.SheetNames[0];
  return{name:f.name,aoa:XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''})};
}
const nh=h=>String(h==null?'':h).toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'');
// Format SL_DC_SS08_Per_Toko: TANGGAL_PB, KD_STORE, NAMA_STORE, QTY_PB, RP_PB, QTY_PICK, RP_PICK, QTY_SHIP, RP_SHIP, SL_QTY, TOT_ITEM
// (format lama SL ALL TAG: TANGGAL SL, KODE, NAMA, QTY PB, QTY SHIP, BRANCH — tetap dikenali)
const SLCOLS={tgl:/^(TANGGAL(_PB|_SL)?|TGL(_PB|_SL)?)$/,kode:/^(KD_STORE|KODE(_TOKO|_STORE)?)$/,nama:/^(NAMA(_STORE|_TOKO)?)$/,qpb:/^QTY_PB$/,rpb:/^(RP_PB|RP_PB_)$/,qpk:/^QTY_PICK$/,rpk:/^RP_PICK$/,qsh:/^QTY_SHIP$/,rsh:/^RP_SHIP$/,slq:/^SL_QTY$/,item:/^(TOT_ITEM|ITEM_PB)$/,br:/^(BRANCH|BREANC|BRANCH_NAME)$/};
function parseSL(aoa,known,brOf){
  let hi=-1,map={};
  for(let i=0;i<Math.min(aoa.length,25);i++){const m={};aoa[i].forEach((h,j)=>{const k=nh(h);for(const key in SLCOLS)if(m[key]===undefined&&SLCOLS[key].test(k))m[key]=j});if(m.tgl!==undefined&&m.kode!==undefined){hi=i;map=m;break}}
  if(hi<0)throw new Error('Kolom TANGGAL_PB dan KD_STORE tidak ditemukan. Gunakan file format SL_DC_SS08_Per_Toko.');
  if(map.qsh===undefined&&map.rsh===undefined)throw new Error('Kolom QTY_SHIP / RP_SHIP tidak ditemukan di file');
  const agg={},skip={kosong:0,tanggal:0};let dupe=0;
  for(let i=hi+1;i<aoa.length;i++){const r=aoa[i],k=String(r[map.kode]==null?'':r[map.kode]).trim().toUpperCase();
    if(!k||/^(TOTAL|GRAND)/.test(k)){skip.kosong++;continue}
    const t=toDS(r[map.tgl]);if(!t){skip.tanggal++;continue}
    const key=t+'|'+k,v=c=>map[c]===undefined?0:toNum(r[map[c]]);
    if(agg[key]){dupe++;const a=agg[key];a[4]+=v('qpb');a[5]+=v('qsh');a[6]+=v('rpb');a[7]+=v('qpk');a[8]+=v('rpk');a[9]+=v('rsh');a[11]+=v('item');a[10]=a[6]?Math.round(a[9]/a[6]*1000)/10:a[10];continue}
    agg[key]=[t,k,map.nama===undefined?'':String(r[map.nama]).trim(),map.br!==undefined?String(r[map.br]).trim().toUpperCase():(brOf[k]||''),v('qpb'),v('qsh'),v('rpb'),v('qpk'),v('rpk'),v('rsh'),v('slq'),v('item')];
  }
  const rows=Object.values(agg);if(!rows.length)throw new Error('Tidak ada baris data yang valid di file');
  const dts=rows.map(r=>r[0]).sort(),ks=new Set(rows.map(r=>r[1]));let rpPb=0,rpShip=0;rows.forEach(r=>{rpPb+=r[6];rpShip+=r[9]});
  return{rows,min:dts[0],max:dts[dts.length-1],kodes:ks.size,unk:[...ks].filter(k=>!known.has(k)),rpPb,rpShip,skip,dupe,cols:Object.keys(map).length};
}

async function readSL(f){
  if(!f)return;busy(true,'Membaca file...');
  try{const t=await readTable(f),brOf={};S.d.toko.forEach(x=>brOf[x.kode]=x.branch);
    const p=parseSL(t.aoa,new Set(S.d.toko.map(x=>x.kode)),brOf);S.sl=Object.assign({name:f.name},p)}
  catch(e){toast(e.message,true);S.sl=null}finally{busy(false);render()}
}
function doSL(){
  const s=S.sl;if(!s)return;
  run(async()=>{
    const dates=[...new Set(s.rows.map(r=>r[0]))];await apiRetry('slBegin',{dates});
    const N=3000;for(let i=0;i<s.rows.length;i+=N){busy(true,'Mengunggah '+Math.min(i+N,s.rows.length)+' / '+s.rows.length);await apiRetry('slAppend',{rows:s.rows.slice(i,i+N)})}
    await apiRetry('slEnd',{file:s.name,count:s.rows.length,min:s.min,max:s.max,rpPb:Math.round(s.rpPb),rpShip:Math.round(s.rpShip)});
    S.per=s.max.slice(0,7);$('#per').value=S.per;S.cutSel=null;S.sl=null;await load();
  },'Memproses SL...','SL tersimpan — plan vs aktual terbarui');
}

// ====== Download: format REP_JWC_TOKO (Report JWC Toko) ======
function vDownload(){
  const brs=S.d.branches;
  return card(`<div class="text-sm font-bold mb-1">Download Jadwal Toko — ${S.per}</div><p class="text-xs text-slate-400 mb-4">Format utama <b>Report JWC Toko</b> (sama dengan file REP_JWC_TOKO): judul, Branch, Periode, Print Date, lalu kolom No., Kode Toko, Nama Toko, Insial, Rit, dan tanggal 1–31 berisi 0 / 1.</p>
   <div class="grid sm:grid-cols-2 gap-3 max-w-xl">
    <div><label class="lbl">Format laporan</label><select id="dr" class="inp"><option value="jwc">Report JWC Toko (seperti REP_JWC_TOKO)</option><option value="matrix">Matrix ringkas (A=kode, B=carry, C–AG=tanggal)</option></select></div>
    <div><label class="lbl">Isi</label><select id="dk" class="inp"><option value="plan">Plan (jadwal)</option><option value="act">Aktual (SL)</option></select></div>
    <div><label class="lbl">Branch</label><select id="db" class="inp"><option value="">Semua</option>${brs.map(b=>`<option>${esc(b)}</option>`).join('')}</select></div>
    <div><label class="lbl">File</label><select id="df" class="inp"><option value="xls">.xls (HTML, identik REP_JWC_TOKO)</option><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV</option></select></div>
    <div class="space-y-2 pt-1 text-xs sm:col-span-2"><label class="flex gap-2"><input type="checkbox" id="de"> Hanya toko yang punya jadwal (jika dicentang, toko tanpa plan bulan ini tidak ikut)</label>
     <label class="flex gap-2"><input type="checkbox" id="dc" checked> Matrix ringkas: sertakan kolom B (carry hari terakhir bulan lalu) &amp; baris judul</label></div></div>
   <button class="btn btn-p mt-5" onclick="doDL()">⬇️ Download</button>`);
}
function activeInMonth(t){const ps=S.per+'-01',pe=S.per+'-'+pad(S.d.nd);if(t.go&&t.go>pe)return false;if(t.tutup&&t.tutup<=ps&&!(t.go&&t.go>t.tutup))return false;return true}
function dlList(kind,br,only){
  const d=S.d,src=kind==='plan'?d.plan:d.act;
  return d.toko.filter(t=>(!br||t.branch===br)&&(only?(src[t.kode]||'').slice(1,d.nd+1).includes('1'):((src[t.kode]||'').slice(1,d.nd+1).includes('1')||activeInMonth(t)))).sort((a,b)=>a.kode<b.kode?-1:a.kode>b.kode?1:0);
}
function printDate(){const n=new Date();return pad(n.getDate())+'-'+MON3[n.getMonth()]+'-'+n.getFullYear()+' '+pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds())}
function jwcModel(kind,br,only){
  const d=S.d,src=kind==='plan'?d.plan:d.act,rows=dlList(kind,br,only).map((t,i)=>{const s=src[t.kode]||'',r=[i+1,t.kode,t.nama,t.ins,Number(t.rit)||1];for(let k=1;k<=31;k++)r.push(k<=d.nd&&s[k]==='1'?1:0);return r});
  return{head:['Report JWC Toko'+(kind==='act'?' (Aktual SL)':''),'Branch : '+d.setting.DC_NAME+(br?' / '+br:''),'Periode : '+MON_EN[+S.per.slice(5)-1]+' '+S.per.slice(0,4),'Print Date : '+printDate()],rows};
}
function jwcHtml(m){
  const th=t=>`<td rowspan=2 align="center"><b>${t}</td>`;
  let h=`<!DOCTYPE HTML PUBLIC "-//DTC XLS/EN">\n<html>\n<meta charset="UTF-8">\n<b style="font-size:15px">${esc(m.head[0])}<br>\n<b>${esc(m.head[1])}<br>\n<b>${esc(m.head[2])}<br>\n<b>${esc(m.head[3])}<br>\n<br>\n<table border=1>\n<tr bgcolor="#f5b23d">${['No.','Kode Toko','Nama Toko','Insial','Rit'].map(th).join('')}<td colspan=31 align="center"><b>Tanggal</td></tr>\n<tr bgcolor="#f5b23d">`;
  for(let i=1;i<=31;i++)h+=`<td align="center"><b>${i}</td>`;h+='</tr>\n';
  m.rows.forEach(r=>{h+='<tr>'+r.map((v,i)=>`<td>${i>=1&&i<=3?esc(v):v}</td>`).join('')+'</tr>'});
  return h+'</table></html>';
}
function saveBlob(parts,type,name){const b=new Blob(parts,{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function doDL(){
  try{
    const d=S.d,rep=$('#dr').value,kind=$('#dk').value,br=$('#db').value,fmt=$('#df').value,only=$('#de').checked,tag=MON_EN[+S.per.slice(5)-1]+'_'+S.per.slice(0,4);
    if(rep==='jwc'){
      const m=jwcModel(kind,br,only),fn=(kind==='plan'?'REP_JWC_TOKO_':'REP_AKTUAL_TOKO_')+tag+(br?'_'+br.replace(/\s+/g,'_'):'');
      if(fmt==='xls')saveBlob([jwcHtml(m)],'application/vnd.ms-excel',fn+'.xls');
      else{
        const hdr=['No.','Kode Toko','Nama Toko','Insial','Rit'],dayRow=Array.from({length:31},(_,i)=>i+1);
        if(fmt==='csv')saveBlob(['\ufeff'+XLSX.utils.sheet_to_csv(XLSX.utils.aoa_to_sheet([hdr.concat(dayRow)].concat(m.rows)))],'text/csv',fn+'.csv');
        else{
          const aoa=[[m.head[0]],[m.head[1]],[m.head[2]],[m.head[3]],[],hdr.concat(['Tanggal'],new Array(30).fill('')),['','','','',''].concat(dayRow)].concat(m.rows),ws=XLSX.utils.aoa_to_sheet(aoa);
          ws['!merges']=[0,1,2,3,4].map(c=>({s:{r:5,c},e:{r:6,c}})).concat([{s:{r:5,c:5},e:{r:5,c:35}}]);
          ws['!cols']=[{wch:6},{wch:9},{wch:34},{wch:9},{wch:5}].concat(new Array(31).fill({wch:3.5}));
          const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'REP JWC TOKO');XLSX.writeFile(wb,fn+'.xlsx');
        }
      }
      toast('Terunduh: '+nf(m.rows.length)+' toko (format Report JWC Toko)');return;
    }
    // matrix ringkas: A=kode, B=carry (hari terakhir bulan lalu), C..AG = tanggal 1-31
    const carry=$('#dc').checked,src=kind==='plan'?d.plan:d.act,from=carry?0:1,aoa=[];
    if(carry){const[y,m]=S.per.split('-').map(Number),pl=new Date(y,m-1,0).getDate();aoa.push(['KODE'].concat(Array.from({length:32},(_,i)=>i===0?pl:i)))}
    const l=dlList(kind,br,only);l.forEach(t=>{const s=src[t.kode]||'',r=[t.kode];for(let i=from;i<=31;i++)r.push(i<=d.nd&&s[i]==='1'?1:'');aoa.push(r)});
    const ws=XLSX.utils.aoa_to_sheet(aoa),fn=`JADWAL_TOKO_${kind.toUpperCase()}_${S.per}`;
    if(fmt==='csv')saveBlob([XLSX.utils.sheet_to_csv(ws)],'text/csv',fn+'.csv');
    else{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'JADWAL');XLSX.writeFile(wb,fn+'.'+(fmt==='xls'?'xlsx':fmt))}
    toast('Terunduh: '+nf(l.length)+' toko');
  }catch(e){toast('Gagal download: '+e.message,true)}
}

// ====== Admin: user, pengaturan, backup, impor awal ======
function vAdmin(){const st=S.d.setting;return`<div class="space-y-5">
  ${card(`<div class="flex justify-between mb-3"><div class="text-sm font-bold">Pengguna &amp; Hak Akses</div><button class="btn btn-p" onclick="formUser()">+ Pengguna</button></div><div id="ul" class="overflow-auto max-h-[40vh] text-xs">Memuat...</div>
   <p class="text-[11px] text-slate-500 mt-2">Peran: admin (semua), editor (lihat, ubah, upload, download), viewer (lihat, download). Izin bisa disesuaikan per orang. Izin "download" hanya menyembunyikan menu/tombol di aplikasi.</p>`)}
  ${card(`<div class="text-sm font-bold mb-3">Pengaturan Laporan &amp; Alarm</div><div class="grid sm:grid-cols-2 gap-4 max-w-3xl">
   <div><label class="lbl">Nama Branch/DC di judul Report JWC Toko</label><div class="flex gap-2"><input id="sdc" class="inp" value="${esc(st.DC_NAME)}"><button class="btn" onclick="saveSetting('DC_NAME','sdc')">Simpan</button></div></div>
   <div><label class="lbl">Email penerima alarm harian (GO &amp; tutup)</label><div class="flex gap-2"><input id="sem" class="inp" value="${esc(st.ALARM_EMAIL)}"><button class="btn" onclick="saveSetting('ALARM_EMAIL','sem')">Simpan</button></div></div></div>
   <div class="mt-3"><button class="btn btn-s" onclick="sendAlarmNow()">✉️ Kirim email alarm sekarang (uji)</button></div><p class="text-[11px] text-slate-500 mt-2">Email otomatis terkirim tiap pagi jam 06:00 bila ada toko GO / tutup H-3, GO belum ada SL, atau toko &gt; 4 hari belum kirim (jalankan installTriggers() sekali di Apps Script).</p>`)}
  ${card(`<div class="flex justify-between mb-3"><div class="text-sm font-bold">Backup (Google Drive)</div><button class="btn btn-p" onclick="backupNow()">Backup Sekarang</button></div><div id="bl" class="text-xs max-h-48 overflow-auto">Memuat...</div><p class="text-[11px] text-slate-500 mt-2">Otomatis tiap malam jam 02:00 + sebelum upload SL / impor. Menyimpan 60 backup terakhir.</p>`)}
  ${card(`<div class="text-sm font-bold mb-1">Impor Awal dari File JPF (sekali di awal / tiap bulan baru)</div><p class="text-xs text-slate-400 mb-3">Membaca sheet "DETAIL JPF VS REALISASI" dan "1. MASTER GROUP (SETTING)": master toko (termasuk Rit bila ada kolom RIT), group, tutup/GO, target bulan, dan plan dasar periode di file. File ringan tersedia di folder <b>data/</b> proyek. <b class="text-amber-400">Menimpa master toko &amp; group yang ada.</b> Backup dibuat otomatis.</p><input type="file" accept=".xlsx" class="inp" onchange="imporJPF(this.files[0])">`)}</div>`}
async function loadAdmin(){
  try{S.users=await api('users.list');$('#ul')&&($('#ul').innerHTML=`<table class="w-full"><thead><tr><th>Username</th><th>Peran</th><th>Izin</th><th>Login terakhir</th><th></th></tr></thead><tbody>${S.users.map(u=>`<tr><td class="font-bold">${esc(u.username)} ${u.disabled?'<span class="text-red-400">(nonaktif)</span>':''}</td><td>${esc(u.role)}</td><td class="text-slate-400">${esc(u.perms.join(', '))}</td><td>${esc((u.last||'').slice(0,22))}</td><td><button class="btn" onclick="formUser('${esc(u.username)}')">Edit</button></td></tr>`).join('')}</tbody></table>`);
    S.backups=await api('backups');$('#bl')&&($('#bl').innerHTML=S.backups.length?S.backups.map(b=>`<div class="py-1 border-b border-slate-800"><a class="text-sky-400" target="_blank" rel="noopener" href="${esc(b.url)}">${esc(b.name)}</a> <span class="text-slate-500">${esc(b.at)}</span></div>`).join(''):'Belum ada backup')}catch(e){toast(e.message,true)}
}
function saveSetting(key,id){run(async()=>{await api('settingSave',{key,value:$('#'+id).value});await load()},'Menyimpan...','Pengaturan disimpan')}
function formUser(name){
  const u=S.users.find(x=>x.username===name)||{username:'',role:'viewer',perms:['view','download'],disabled:false},P=['view','edit','upload','download'];
  openModal(`<h3 class="font-bold mb-4">${name?'Edit':'Tambah'} Pengguna</h3><div class="grid grid-cols-2 gap-3">
   <div><label class="lbl">Username</label><input id="uu" class="inp" value="${esc(u.username)}" ${name?'readonly':''}></div><div><label class="lbl">Password ${name?'(kosongkan jika tidak diganti)':''}</label><input id="up" type="password" class="inp"></div>
   <div><label class="lbl">Peran</label><select id="ur" class="inp" onchange="roleDef()">${['admin','editor','viewer'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
   <div class="flex items-end"><label class="flex gap-2 text-xs"><input type="checkbox" id="ud" ${u.disabled?'checked':''}> Nonaktifkan akun</label></div>
   <div class="col-span-2 flex gap-4 text-xs">${P.map(p=>`<label class="flex gap-1"><input type="checkbox" class="up" value="${p}" ${u.perms.includes(p)?'checked':''}> ${p}</label>`).join('')}</div></div>
   <div class="flex justify-end gap-2 mt-5"><button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-p" onclick="saveUser()">Simpan</button></div>`);
}
function roleDef(){const r=$('#ur').value,D={admin:['view','edit','upload','download'],editor:['view','edit','upload','download'],viewer:['view','download']}[r];document.querySelectorAll('.up').forEach(c=>c.checked=D.includes(c.value))}
function saveUser(){run(async()=>{await api('users.save',{username:$('#uu').value,password:$('#up').value,role:$('#ur').value,disabled:$('#ud').checked,perms:[...document.querySelectorAll('.up:checked')].map(c=>c.value)});closeModal();await loadAdmin()},'Menyimpan...','Pengguna disimpan (berlaku saat login ulang)')}
function backupNow(){run(async()=>{const r=await api('backupNow');await loadAdmin();toast('Backup: '+r.name)},'Membuat backup...')}
// parser JPF dipisah agar bisa diuji: menerima array-of-array sheet DETAIL (D) dan MASTER GROUP (M)
function parseJPF(D,M){
  const mo=Number(D[13]&&D[13][20]),yr=Number(D[13]&&D[13][21]);if(!mo||!yr)throw new Error('Bulan/tahun (U14/V14) tidak terbaca');
  const periode=yr+'-'+pad(mo),stores=[],seen={},dups=[],brCount={},ritCol=(D[15]||[]).findIndex(x=>String(x).trim().toUpperCase()==='RIT');
  for(let i=16;i<D.length;i++){const r=D[i],kode=String(r[1]||'').trim().toUpperCase();if(!kode)continue;
    if(seen[kode]){dups.push(kode);continue}seen[kode]=1;
    let plan='';for(let c=19;c<=50;c++)plan+=Number(r[c])===1?'1':'0';
    const g=String(r[10]||'').trim().toUpperCase(),b=String(r[7]||'').trim().toUpperCase(),rt=ritCol>=0?String(r[ritCol]||'').trim():'';
    stores.push({kode,ins:String(r[2]||''),nama:String(r[3]||''),branch:b,group:g,ket:String(r[16]||'').trim(),tutup:toDS(r[17]),go:toDS(r[18]),plan,rit:/^[1-9]$/.test(rt)?rt:'1'});
    if(g){brCount[g]=brCount[g]||{};brCount[g][b]=(brCount[g][b]||0)+1}}
  const groups=[];for(let i=15;i<M.length;i++){const r=M[i],g=String(r[1]||'').trim().toUpperCase();if(!g||!/^[A-Z]{3}\d{2}$/.test(g))continue;
    const bc=brCount[g]||{},br=Object.keys(bc).sort((a,b)=>bc[b]-bc[a])[0]||'';groups.push({group:g,branch:br,h1:String(r[2]||'').trim().toUpperCase(),h2:String(r[3]||'').trim().toUpperCase(),h3:String(r[4]||'').trim().toUpperCase()})}
  if(!stores.length||!groups.length)throw new Error('Data toko/group tidak terbaca dari file');
  const target=Number(M[7]&&M[7][3])||0,branches=[...new Set(stores.map(s=>s.branch).filter(Boolean))];
  return{periode,stores,groups,dups,target,branches};
}
async function imporJPF(f){
  if(!f||!confirm('Impor akan MENIMPA master toko & group. Lanjut?'))return;
  run(async()=>{
    busy(true,'Membaca file JPF (bisa 10–30 detik)...');
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',sheets:['DETAIL JPF VS REALISASI','1. MASTER GROUP (SETTING)']});
    const wd=wb.Sheets['DETAIL JPF VS REALISASI'],wm=wb.Sheets['1. MASTER GROUP (SETTING)'];if(!wd||!wm)throw new Error('Sheet DETAIL JPF VS REALISASI / 1. MASTER GROUP (SETTING) tidak ditemukan');
    const J=parseJPF(XLSX.utils.sheet_to_json(wd,{header:1,raw:true,defval:''}),XLSX.utils.sheet_to_json(wm,{header:1,raw:true,defval:''}));
    try{
      busy(true,'Menyiapkan impor...');await apiRetry('imporBegin',{periode:J.periode,groups:J.groups,branches:J.branches});
      for(let i=0;i<J.stores.length;i+=300){busy(true,'Impor toko '+Math.min(i+300,J.stores.length)+' / '+J.stores.length);await apiRetry('imporToko',{periode:J.periode,rows:J.stores.slice(i,i+300)})}
      await apiRetry('imporEnd',{periode:J.periode,count:J.stores.length,groupCount:J.groups.length,dups:J.dups,target:J.target});
    }catch(e){throw new Error('Impor terhenti: '+e.message+' — data lama aman di menu Admin > Backup. Ulangi impor.')}
    S.per=J.periode;$('#per').value=J.periode;S.cutSel=null;await load();
    toast('Impor selesai: '+J.stores.length+' toko, '+J.groups.length+' group, periode '+J.periode+(J.target?', target '+nf(J.target):'')+(J.dups.length?' — kode ganda dilewati: '+J.dups.join(', '):''));
  },'Impor...');
}
